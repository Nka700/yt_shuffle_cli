[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ytm"
version = "1.1.1"
description = "YouTube Music CLI ユーティリティ — プレイリスト一覧表示とシャッフル音声再生"
readme = "USAGE.md"
requires-python = ">=3.8"
license = "MIT"

[project.scripts]
ytm = "ytm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/ytm"]
